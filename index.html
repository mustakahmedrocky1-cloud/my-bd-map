<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার বাংলাদেশ ভ্রমণ ম্যাপ</title>
    <style>
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #2c3e50; }
        .container {
            max-width: 600px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .stats {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #27ae60;
        }
        .district-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 10px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .district-btn {
            padding: 8px;
            border: 1px solid #3498db;
            background-color: #fff;
            color: #3498db;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
        }
        .district-btn.visited {
            background-color: #2ecc71;
            color: white;
            border-color: #2ecc71;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>বাংলাদেশ ভ্রমণ ট্র্যাকার</h1>
    <div class="stats">
        ভ্রমণকৃত জেলা: <span id="count">০</span> / ৬৪
    </div>

    <h3>যেসব জেলা ঘুরেছেন সেগুলোতে ক্লিক করুন:</h3>
    <div class="district-list" id="districtContainer"></div>
</div>

<script>
    // বাংলাদেশের ৬৪টি জেলার তালিকা
    const districts = [
        "ঢাকা", "গাজীপুর", "নারায়ণগঞ্জ", "মুন্সীগঞ্জ", "মানিকগঞ্জ", "নরসিংদী", "ফরিদপুর", "মাদারীপুর", "গোপালগঞ্জ", "রাজবাড়ী", "শরীয়তপুর", "টাঙ্গাইল", "কিশোরগঞ্জ",
        "চট্টগ্রাম", "কক্সবাজার", "বান্দরবান", "রাঙ্গামাটি", "খাগড়াছড়ি", "কুমিল্লা", "ফেনী", "নোয়াখালী", "লক্ষ্মীপুর", "চাঁদপুর", "ব্রাহ্মণবাড়িয়া",
        "রাজশাহী", "বগুড়া", "পাবনা", "সিরাজগঞ্জ", "নাটোর", "নওগাঁ", "চাঁপাইনবাবগঞ্জ", "জয়পুরহাট",
        "খুলনা", "যশোর", "সাতক্ষীরা", "বাগেরহাট", "ঝিনাইদহ", "কুষ্টিয়া", "মাগুরা", "মেহেরপুর", "নড়াইল", "চুয়াডাঙ্গা",
        "বরিশাল", "পটুয়াখালী", "ভোলা", "ঝালকাঠি", "পিরোজপুর", "বরগুনা",
        "সিলেট", "মৌলভীবাজার", "হবিগঞ্জ", "সুনামগঞ্জ",
        "রংপুর", "দিনাজপুর", "গাইবান্ধা", "কুড়িগ্রাম", "লালমনিরহাট", "নীলফামারী", "পঞ্চগড়", "ঠাকুরগাঁও",
        "ময়মনসিংহ", "জামালপুর", "শেরপুর", "নেত্রকোণা"
    ];

    let visitedCount = 0;
    const districtContainer = document.getElementById('districtContainer');
    const countDisplay = document.getElementById('count');

    // বাংলা সংখ্যায় রূপান্তর
    function toBanglaNum(num) {
        return num.toString().replace(/\d/g, d => "০১২৩৪৫৬৭৮৯"[d]);
    }

    // বোতাম তৈরি ও ক্লিক ইভেন্ট হ্যান্ডলার
    districts.forEach(district => {
        const btn = document.createElement('button');
        btn.classList.add('district-btn');
        btn.innerText = district;

        btn.onclick = function() {
            if (btn.classList.contains('visited')) {
                btn.classList.remove('visited');
                visitedCount--;
            } else {
                btn.classList.add('visited');
                visitedCount++;
            }
            countDisplay.innerText = toBanglaNum(visitedCount);
        };

        districtContainer.appendChild(btn);
    });
</script>

</body>
</html>
